<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <meta name="theme-color" content="#FC4C02">
  <title>GymTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css?v=4">

  <!-- iOS home screen icons (add to home screen prompt) -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <!-- Main app content -->
  <div id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <span style="color:var(--txt2);font-size:.85rem">Loading GymTrack…</span>
    </div>
  </div>

  <!-- Bottom navigation -->
  <nav id="bottom-nav" class="hidden">

    <button class="nav-btn" data-screen="dashboard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      <span>Home</span>
    </button>

    <button class="nav-btn" data-screen="history">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>History</span>
    </button>

    <!-- Workout — centre CTA button -->
    <button class="nav-btn workout-btn" data-screen="workout">
      <div class="nav-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </div>
      <span>Workout</span>
    </button>

    <button class="nav-btn" data-screen="routines">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span>Routines</span>
    </button>

    <button class="nav-btn" data-screen="profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profile</span>
    </button>

  </nav>

  <!-- Modal / bottom sheet root -->
  <div id="modal-root"></div>

  <!-- Scripts: order matters -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/exercises.js?v=3"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/app.js?v=3"></script>

</body>
</html>
