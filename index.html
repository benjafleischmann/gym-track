<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- The GitHub Pages copy is superseded by Firebase Hosting, which is the
       only origin that is same-origin with the Google auth handler. Sign-in
       is permanently broken on github.io, so bounce visitors to the live app.
       Runs before anything else loads; a no-op on every other host. Query and
       hash are preserved so ?addFriend= invite links still work. -->
  <script>
    if (location.hostname.endsWith('github.io')) {
      location.replace('https://gym-app-f6e7d.firebaseapp.com/' + location.search + location.hash);
    }
  </script>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <meta name="theme-color" content="#FC4C02">
  <title>GymTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css?v=13">

  <!-- iOS home screen icons (add to home screen prompt) -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <!-- Main app content -->
  <div id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <span style="color:var(--txt2);font-size:.85rem">Loading GymTrack…</span>
    </div>
  </div>

  <!-- Bottom navigation -->
  <nav id="bottom-nav" class="hidden">

    <button class="nav-btn" data-screen="dashboard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9,22 9,12 15,12 15,22"/>
      </svg>
      <span>Home</span>
    </button>

    <button class="nav-btn" data-screen="progress">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3,17 9,11 13,15 21,7"/>
        <polyline points="15,7 21,7 21,13"/>
      </svg>
      <span>Progress</span>
    </button>

    <!-- Workout — centre CTA button -->
    <button class="nav-btn workout-btn" data-screen="workout">
      <div class="nav-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </div>
      <span>Workout</span>
    </button>

    <button class="nav-btn" data-screen="routines">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span>Routines</span>
    </button>

    <button class="nav-btn" data-screen="profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profile</span>
    </button>

  </nav>

  <!-- Modal / bottom sheet root -->
  <div id="modal-root"></div>

  <!-- Scripts: order matters -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/exercises.js?v=5"></script>
  <script src="js/exercise-library.js?v=3"></script>
  <script src="js/data.js?v=8"></script>
  <script src="js/firebase.js?v=2"></script>
  <script src="js/recommend.js?v=1"></script>
  <script src="js/garmin.js?v=3"></script>
  <script src="js/app.js?v=18"></script>

</body>
</html>
